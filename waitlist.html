<style>
  html, body {
    height: 100%;
    min-height: 100vh;
    width: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: var(--body);
    color: var(--white);
    letter-spacing: normal;
    background-color: var(--dark);
    background-image: url('IMAGES/WAITLISTHEADER.jpg');
    background-repeat: no-repeat;
    background-size: cover;
    background-position: center top;
    position: relative;
  }

  /* Dark overlay so text pops over the photo */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(
      160deg,
      rgba(28, 14, 11, 0.88) 0%,
      rgba(120, 44, 30, 0.78) 50%,
      rgba(28, 14, 11, 0.92) 100%
    );
    z-index: 0;
  }

  /* Grain texture */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
    opacity: 0.5;
  }

  .page {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px 80px;
    text-align: center;
  }

  /* ── LOGO ── */
  .logo {
    width: clamp(160px, 40vw, 280px);
    height: auto;
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.1s;
    filter: drop-shadow(0 4px 32px rgba(0,0,0,0.6));
  }

  /* ── BADGE ── */
  .badge {
    font-family: var(--display);
    font-size: 13px;
    letter-spacing: 0.22em;
    color: var(--dark);
    background: var(--blush);
    padding: 5px 18px 3px;
    margin-bottom: 28px;
    display: inline-block;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.2s;
  }

  /* ── HEADLINE ── */
  .headline {
    font-family: var(--display);
    font-size: clamp(56px, 15vw, 110px);
    line-height: 0.88;
    color: var(--white);
    letter-spacing: 0.02em;
    margin-bottom: 8px;
    opacity: 0;
    animation: fadeUp 0.7s ease forwards 0.3s;
  }

  .headline em {
    color: var(--blush);
    font-style: normal;
  }

  /* ── EVENT INFO ── */
  .event-info {
    margin-top: 20px;
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.4s;
  }

  .event-title {
    font-family: var(--display);
    font-size: clamp(14px, 3vw, 18px);
    letter-spacing: 0.2em;
    color: var(--white);
    margin-bottom: 8px;
  }

  .event-details {
    font-size: 13px;
    color: var(--white);
    letter-spacing: 0.1em;
    font-weight: 300;
    line-height: 1.8;
  }

  /* ── FORM ── */
  .form-wrap {
    width: 100%;
    max-width: 400px;
    opacity: 0;
    animation: fadeUp 0.6s ease forwards 0.5s;
  }

  .form-label {
    font-size: 10px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--white);
    margin-bottom: 14px;
    display: block;
  }

  #waitlistForm {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  #waitlistForm input {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-bottom: none;
    color: var(--white);
    font-family: var(--body);
    font-size: 14px;
    font-weight: 300;
    padding: 15px 18px;
    outline: none;
    transition: background 0.2s, border-color 0.2s;
    letter-spacing: 0.03em;
    -webkit-appearance: none;
  }

  #waitlistForm input:last-of-type {
    border-bottom: 1px solid rgba(255,255,255,0.15);
  }

  #waitlistForm input::placeholder {
    color: rgba(255,255,255,0.28);
  }

  #waitlistForm input:focus {
    background: rgba(240,179,160,0.1);
    border-color: var(--blush);
    z-index: 1;
    position: relative;
  }

  #waitlistForm button[type="submit"] {
    width: 100%;
    margin-top: 10px;
    background: var(--blush-deep);
    border: none;
    color: var(--white);
    font-family: var(--display);
    font-size: 20px;
    letter-spacing: 0.18em;
    padding: 16px 24px 13px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  #waitlistForm button[type="submit"]:hover {
    background: var(--blush);
    color: var(--dark);
    transform: translateY(-1px);
  }

  #waitlistForm button[type="submit"]:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* Success Message Styling */
  .success-message {
    display: none;
    margin-top: 20px;
    padding: 16px 20px;
    background: rgba(240,179,160,0.12);
    border-left: 3px solid var(--blush);
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    text-align: left;
    line-height: 1.6;
  }

  /* ── FINE PRINT ── */
  .fine-print {
    margin-top: 18px;
    font-size: 11px;
    color: rgba(255,255,255,1);
    letter-spacing: 0.05em;
    line-height: 1.7;
  }

  .fine-print a {
    color: var(--white);
    text-decoration: none;
  }

  .fine-print a:hover {
    text-decoration: underline;
  }

  /* ── FOOTER ── */
  .footer-link {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.2);
    text-decoration: none;
    z-index: 10;
    transition: color 0.2s;
    white-space: nowrap;
  }

  .footer-link:hover { color: var(--blush); }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── MOBILE ── */
  @media (max-width: 480px) {
    .page { padding: 48px 20px 100px; }
    .logo { margin-bottom: 28px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .logo, .badge, .headline, .card-hero, .intro, .perks, .fine-print-section, .widget-wrap,
    .event-info, .form-wrap { opacity: 1; }
  }
</style>

<body>

<div class="page">

  <img
    src="IMAGES/BUMPANDGRIND-MAIN-LOGO.png"
    alt="Bump & Grind"
    class="logo"
    width="1980" height="2067"
  >

  <h1 class="headline">JOIN<br>THE <em>WAITLIST.</em></h1>

  <div class="event-info">
    <p class="event-title">BUMP &amp; GRIND: R&amp;B DAY PARTY</p>
    <p class="event-details">
      SUNDAY, JUNE 21ST · 4PM – 8PM<br>
      THE PINT ROOFTOP PATIO · DOWNTOWN HALIFAX
    </p>
  </div>

  <div class="form-wrap">
    <span class="form-label" id="formSubtitle">We'll reach out if a ticket opens up</span>

    <form id="waitlistForm" action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="b6fb76de-b533-4d31-98c4-b805f0e711e1">
      
      <input type="checkbox" name="botcheck" class="hidden" style="display: none;">
      
      <input type="hidden" name="event" value="June 21 Patio Party Waitlist">
      <label for="wlName" class="sr-only">First name</label>
      <input type="text"  name="name" id="wlName" placeholder="FIRST NAME"     autocomplete="given-name" required>
      <label for="wlEmail" class="sr-only">Email address</label>
      <input type="email" name="email" id="wlEmail" placeholder="EMAIL ADDRESS"  autocomplete="email"      required>
      <button type="submit">COUNT ME IN</button>
    </form>

    <div id="result" class="success-message" role="status" aria-live="polite"></div>

    <p class="fine-print">
      We'll only contact you if a ticket opens up. No spam, ever.<br>
      <a href="https://www.bumpandgrindhfx.com">← Back to bumpandgrindhfx.com</a>
    </p>
  </div>

</div>

<script>
  const form = document.getElementById('waitlistForm');
  const result = document.getElementById('result');
  const subtitle = document.getElementById('formSubtitle');

  form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.innerText = 'SENDING…';

      // Capture the data exactly as the working HTML version did
      const formData = new FormData(form);

      // Send it as a raw form submission, bypassing the strict JSON spam filters
      fetch('https://api.web3forms.com/submit', {
              method: 'POST',
              body: formData
          })
          .then(async (response) => {
              if (response.status == 200) {
                  // Hide the form fields and subtitle
                  form.style.display = 'none';
                  subtitle.style.display = 'none';
                  
                  // Show the success message
                  result.style.display = 'block';
                  result.innerHTML = "You're on the list. We'll reach out if a ticket opens up.";

                  if (typeof fbq === 'function') {
                    fbq('track', 'Lead', { content_name: 'Ticket Waitlist' });
                  }
              } else {
                  console.log(response);
                  result.style.display = 'block';
                  result.innerHTML = "Something went wrong. Please try again.";
                  submitButton.disabled = false;
                  submitButton.innerText = 'COUNT ME IN';
              }
          })
          .catch(error => {
              console.log(error);
              result.style.display = 'block';
              result.innerHTML = "Something went wrong. Please try again.";
              submitButton.disabled = false;
              submitButton.innerText = 'COUNT ME IN';
          });
  });
</script>

</body>
